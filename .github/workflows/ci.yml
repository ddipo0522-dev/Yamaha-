name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unittest suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unittest suite
        run: python3 -m unittest discover -s tests -t . -v
